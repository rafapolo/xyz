# Jekyll Configuration for GitHub Pages with Mermaid Support
markdown: kramdown
highlighter: rouge
theme: minima

# Kramdown configuration
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Site settings
title: "ミxplorando Novas Tecnologias Cartográficas"
description: "Visualização de dados públicos integrando Censos do IBGE, CNEFE e Cadastro da Receita Federal"
baseurl: ""
url: "https://xn--2dk.xyz"

# Build settings
safe: true
incremental: false

# Enable GitHub Pages plugins
plugins:
  - jekyll-default-layout
  - jekyll-titles-from-headings

# Custom settings for Mermaid support
mermaid: true