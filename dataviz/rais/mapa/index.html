<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Salarial do Brasil — remuneração do emprego formal por município (RAIS 2020–2024)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
  <link rel="stylesheet" href="../atlas.css">
  <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="../atlas.js"></script>
  <style>
    #control-panel { max-height: calc(100vh - 80px); }
    .filter-item .color-dot { width: 12px; height: 12px; border-radius: 3px; }
    .metric-pills { justify-content: center; }
    /* legenda alinhada e com a mesma largura do painel de controles */
    @media (min-width: 981px) {
      #legend { width: 285px; max-width: 285px; left: 16px; }
    }
    #legend .gradient-bar { width: 100%; }
    .panel-section {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }
    .panel-section-title {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 6px;
    }
    .panel-section-title h3 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-secondary);
    }
    .panel-section-title .section-context {
      font-size: 10px; color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    @media (max-width: 720px) {
      #atlas-nav span:nth-child(2), #atlas-nav span:nth-child(3) { display: none; }
      #atlas-nav a { margin-left: auto; }
    }

    /* --- Tooltip redesign --- */
    #tooltip { padding: 12px 14px; min-width: 260px; max-width: 320px; }
    #tooltip .tt-cell .v { white-space: nowrap; }
    #tooltip .tt-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    }
    #tooltip .tt-badge {
      font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle); border-radius: 3px;
      padding: 1px 5px; flex-shrink: 0;
    }
    #tooltip .tt-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    #tooltip .tt-metric { font-size: 20px; font-weight: 600; line-height: 1.2; font-family: 'JetBrains Mono', monospace; }
    #tooltip .tt-metric-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px; }
    #tooltip .tt-range { margin: 2px 0 10px; }
    #tooltip .tt-range-head {
      display: flex; justify-content: space-between;
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-muted); margin-bottom: 3px;
    }
    #tooltip .tt-range-bar { position: relative; height: 5px; border-radius: 3px; }
    #tooltip .tt-range-marker {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 9px; height: 9px; border-radius: 50%;
      background: #fff; border: 2px solid rgba(10,14,26,0.9);
      box-shadow: 0 0 4px rgba(0,0,0,0.6);
    }
    #tooltip .tt-range-labels {
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace; margin-top: 3px;
    }
    #tooltip .tt-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px;
      padding-top: 8px; border-top: 1px solid var(--border-item);
    }
    #tooltip .tt-cell { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
    #tooltip .tt-cell .k { color: var(--text-muted); }
    #tooltip .tt-cell .v { font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); }
  </style>
</head>
<body>

<nav id="atlas-nav">
  <span style="color:var(--text-primary);font-weight:600">Atlas Salarial do Brasil</span>
  <span style="color:var(--text-muted)">· quanto paga o emprego formal em cada município</span>
  <span style="margin-left:auto;font-size:11px;color:var(--text-muted)">RAIS · vínculos ativos 2020–2024</span>
  <a href="https://ミ.xyz/" style="font-size:11px">todos dataviz</a>
</nav>

<div id="app">
  <div id="deckgl-overlay"></div>

  <!-- Control panel -->
  <div class="panel" id="control-panel">
    <div class="panel-header">
      <span class="panel-dot">⌖</span>
      <h2>Salário RAIS</h2>
    </div>
    <div class="panel-subtitle">Vínculos formais ativos por município</div>

    <div class="select-group">
      <label for="select-setor">Setor</label>
      <select id="select-setor">
        <option value="privado">Iniciativa Privada</option>
        <option value="publico">Setor Público</option>
        <option value="todos">Todos os Setores</option>
      </select>
    </div>

    <div class="select-group">
      <label for="select-ano">Ano</label>
      <select id="select-ano">
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
      </select>
    </div>

    <div style="margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);">Métrica do mapa</div>
    <div class="metric-pills" id="metric-pills">
      <button class="metric-pill active" data-metric="salario_medio">Média (R$)</button>
      <button class="metric-pill" data-metric="salario_stddev">Desvio Padrão</button>
      <button class="metric-pill" data-metric="coef_variacao">Coef. Variação</button>
      <button class="metric-pill" data-metric="range_p75_p25">Range P75-P25</button>
    </div>

    <!-- Integrated stats -->
    <div class="panel-section" id="stats-content">
      <div class="panel-section-title">
        <h3>Brasil</h3>
        <span class="section-context" id="stat-context">—</span>
      </div>
      <div class="stat-row"><span class="stat-label">Média municípios</span><span class="stat-value" id="stat-media">—</span></div>
      <div class="stat-row"><span class="stat-label">Menor município</span><span class="stat-value" id="stat-menor">—</span></div>
      <div class="stat-row"><span class="stat-label">Maior município</span><span class="stat-value" id="stat-maior">—</span></div>
      <div class="stat-row" style="border-top:1px solid var(--border-item);margin-top:6px;padding-top:10px;">
        <span class="stat-label">Vínculos</span><span class="stat-value" id="stat-vinculos">—</span>
      </div>
      <div class="stat-row"><span class="stat-label">Municípios</span><span class="stat-value" id="stat-municipios">—</span></div>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <!-- Legend -->
  <div id="legend"></div>

  <!-- Map actions -->
  <div id="map-actions">
    <button id="btn-reset" title="Resetar vista">⟲</button>
    <button id="btn-share" title="Compartilhar">⎘</button>
    <button id="btn-sql" title="Ver dados brutos">{ }</button>
  </div>
</div>

<!-- SQL Modal -->
<div class="modal-overlay" id="sql-modal">
  <div class="modal-content">
    <h3>Query DuckDB</h3>
    <pre><code id="sql-code"></code></pre>
    <button class="modal-close" onclick="document.getElementById('sql-modal').classList.remove('open')">Fechar</button>
  </div>
</div>

<!-- Mobile toggles -->
<button id="toggle-left">☰</button>
<button id="toggle-right">▤</button>
<div id="sheet-backdrop"></div>

<!-- Loading -->
<div id="loading"><div class="loading-spinner"></div></div>

<script>
const VIZ_NUM = 28;

const SQL_TEMPLATE = `WITH salarios AS (
  SELECT id_municipio, sigla_uf, ano,
    CASE WHEN natureza_juridica NOT LIKE '1%' THEN 'privado' ELSE 'publico' END AS setor,
    valor_remuneracao_media
  FROM br_me_rais.microdados_vinculos
  WHERE ano BETWEEN 2020 AND 2024 AND vinculo_ativo_3112 = '1'
)
SELECT id_municipio, sigla_uf, ano, setor,
  ROUND(AVG(valor_remuneracao_media), 2) AS salario_medio,
  ROUND(STDDEV(valor_remuneracao_media), 2) AS salario_stddev,
  ROUND(PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY valor_remuneracao_media), 2) AS p25,
  ROUND(PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY valor_remuneracao_media), 2) AS p75,
  COUNT(*) AS n_vinculos
FROM salarios GROUP BY id_municipio, sigla_uf, ano, setor

UNION ALL

SELECT id_municipio, sigla_uf, ano, 'todos',
  ROUND(AVG(valor_remuneracao_media), 2),
  ROUND(STDDEV(valor_remuneracao_media), 2),
  ROUND(PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY valor_remuneracao_media), 2),
  ROUND(PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY valor_remuneracao_media), 2),
  COUNT(*)
FROM salarios GROUP BY id_municipio, sigla_uf, ano`;

const METRICS = {
  salario_medio: {
    label: 'Salário médio',
    desc: 'Remuneração média mensal dos vínculos formais do município.',
    palette: ATLAS.SEQUENTIAL_BLUE,
    format: ATLAS.fmtMoney,
    getValue: (d) => d.salario_medio,
  },
  salario_stddev: {
    label: 'Desvio padrão',
    desc: 'Quanto os salários se espalham em torno da média — quanto maior, mais desiguais os salários dentro do município.',
    palette: ATLAS.SEQUENTIAL_RED,
    format: ATLAS.fmtMoney,
    getValue: (d) => d.salario_stddev,
  },
  coef_variacao: {
    label: 'Coef. variação',
    desc: 'Desvio padrão dividido pela média: mede a desigualdade salarial em termos relativos, comparável entre municípios de rendas diferentes.',
    palette: ATLAS.SEQUENTIAL_RED,
    format: (v) => ATLAS.fmtNum(v, 3),
    getValue: (d) => (d.salario_stddev != null && d.salario_medio > 0) ? d.salario_stddev / d.salario_medio : null,
  },
  range_p75_p25: {
    label: 'Range P75-P25',
    desc: 'Diferença entre o salário que separa os 25% mais altos (P75) e os 25% mais baixos (P25) — a largura do “miolo” da distribuição salarial.',
    palette: ATLAS.SEQUENTIAL_RED,
    format: ATLAS.fmtMoney,
    getValue: (d) => (d.p75 != null && d.p25 != null) ? d.p75 - d.p25 : null,
  },
};

// sigla_uf isn't in salarios.json — derive it from the IBGE id prefix
const UF_BY_PREFIX = {
  '11':'RO','12':'AC','13':'AM','14':'RR','15':'PA','16':'AP','17':'TO',
  '21':'MA','22':'PI','23':'CE','24':'RN','25':'PB','26':'PE','27':'AL','28':'SE','29':'BA',
  '31':'MG','32':'ES','33':'RJ','35':'SP','41':'PR','42':'SC','43':'RS',
  '50':'MS','51':'MT','52':'GO','53':'DF',
};
function ufFromId(id) {
  return UF_BY_PREFIX[String(id).slice(0, 2)] || '';
}

let mapInstance, deckInstance;
let geoData = null;       // raw GeoJSON
let salaryLookup = null;  // Map<id_municipio, { ano: { setor: {...} } }>
let choroplethLayer = null;
let currentState = { ano: '2024', setor: 'privado', metrica: 'salario_medio' };
let currentDist = null; // { sorted, min, max, avg } da métrica atual, para o tooltip

function paletteStops(pal) {
  const stops = [];
  pal.forEach((c, i) => {
    const a = (i / pal.length * 100).toFixed(1);
    const b = ((i + 1) / pal.length * 100).toFixed(1);
    stops.push(`rgb(${c.join(',')}) ${a}%`, `rgb(${c.join(',')}) ${b}%`);
  });
  return stops;
}

function percentileOf(sorted, v) {
  let lo = 0, hi = sorted.length;
  while (lo < hi) {
    const m = (lo + hi) >> 1;
    if (sorted[m] <= v) lo = m + 1; else hi = m;
  }
  return sorted.length > 1 ? (lo - 1) / (sorted.length - 1) : 0.5;
}

function getActiveSql() {
  return SQL_TEMPLATE;
}

function getShareState() {
  return currentState;
}

// dados por ano ficam em arquivos separados (dados/salarios_<ano>.json.gz)
// para o primeiro carregamento ser leve; anos são buscados sob demanda
const loadedYears = new Set();

async function ensureYear(ano) {
  if (loadedYears.has(ano)) return;
  const setores = await ATLAS.loadJSON(`dados/salarios_${ano}.json.gz`);
  for (const [setor, entries] of Object.entries(setores)) {
    for (const e of entries) {
      if (e.id_municipio == null) continue;
      if (!salaryLookup[e.id_municipio]) salaryLookup[e.id_municipio] = {};
      if (!salaryLookup[e.id_municipio][ano]) salaryLookup[e.id_municipio][ano] = {};
      salaryLookup[e.id_municipio][ano][setor] = e;
    }
  }
  loadedYears.add(ano);
}

function updateMap() {
  if (!geoData || !salaryLookup) return;

  const { ano, setor, metrica } = currentState;
  const metricDef = METRICS[metrica];
  const features = [];
  const values = [];

  for (const f of geoData.features) {
    const id = f.properties.id_municipio;
    const data = salaryLookup[id]?.[ano]?.[setor];
    if (!data) {
      features.push({
        type: 'Feature',
        geometry: f.geometry,
        properties: { id_municipio: id, _noData: true },
      });
      continue;
    }
    const val = metricDef.getValue(data);
    if (val != null) values.push(val);
    features.push({
      type: 'Feature',
      geometry: f.geometry,
      properties: { ...data, _noData: false, _metricValue: val, _metricFormatted: metricDef.format(val) },
    });
  }

  const merged = { type: 'FeatureCollection', features };

  const sorted = [...values].sort((a, b) => a - b);
  currentDist = {
    sorted,
    min: sorted[0] ?? null,
    max: sorted[sorted.length - 1] ?? null,
    avg: sorted.length ? sorted.reduce((s, v) => s + v, 0) / sorted.length : null,
  };

  const colorScale = ATLAS.quantileScale(values, metricDef.palette);
  const getFillColor = (d) => {
    if (d.properties._noData) return [80, 80, 80, 80];
    return colorScale(d.properties._metricValue);
  };

  // deck.gl layers are immutable descriptors — build a fresh one on every
  // filter change and let deck diff it against the previous instance.
  choroplethLayer = new deck.GeoJsonLayer({
    id: 'rais-choropleth',
    data: merged,
    pickable: true,
    autoHighlight: true,
    highlightColor: [255, 255, 255, 70],
    stroked: true,
    filled: true,
    lineWidthMinPixels: 0.4,
    getFillColor,
    getLineColor: [255, 255, 255, 50],
    getLineWidth: 1,
    onHover: (info) => {
      if (ATLAS.isTouch) return;
      handleHover(info);
    },
    onClick: (info) => {
      if (ATLAS.isTouch) handleHover(info);
    },
    updateTriggers: {
      getFillColor: [ano, setor, metrica],
    },
    transitions: { getFillColor: { duration: 200 } },
  });
  deckInstance.setProps({ layers: [choroplethLayer] });

  updateLegend(values, metricDef);
  updateStats(values, merged);
}

function handleHover(info) {
  if (!info.object) {
    ATLAS.hideTooltip();
    return;
  }
  const p = info.object.properties;
  const { ano, setor, metrica } = currentState;
  const metricDef = METRICS[metrica];

  const nomeMun = window.municipioNome?.[p.id_municipio] || p.id_municipio;

  if (p._noData) {
    ATLAS.showTooltip(info.x, info.y, `
      <div class="tt-name">${nomeMun}</div>
      <div class="tt-detail" style="color:var(--text-muted);">Sem dados de vínculos formais</div>
    `);
    return;
  }

  const cov = (p.salario_stddev != null && p.salario_medio > 0) ? ATLAS.fmtNum(p.salario_stddev / p.salario_medio, 3) : '—';
  const rangeVal = (p.p75 != null && p.p25 != null) ? ATLAS.fmtMoney(p.p75 - p.p25) : '—';

  // posição do município entre o mín e o máx nacional da métrica atual
  let rangeHtml = '';
  if (p._metricValue != null && currentDist && currentDist.sorted.length > 1 && currentDist.max > currentDist.min) {
    const pct = percentileOf(currentDist.sorted, p._metricValue);
    // P100 só para quem é de fato o máximo; a barra é em espaço de quantis,
    // então o marcador usa o percentil (casa com as cores do mapa)
    const pShown = p._metricValue >= currentDist.max ? 100 : Math.min(99, Math.round(pct * 100));
    rangeHtml = `
      <div class="tt-range">
        <div class="tt-range-head">
          <span>mín · máx nacional</span>
          <span>P${pShown} de ${ATLAS.fmtNum(currentDist.sorted.length, 0)} mun.</span>
        </div>
        <div class="tt-range-bar" style="background: linear-gradient(to right, ${paletteStops(metricDef.palette).join(', ')});">
          <div class="tt-range-marker" style="left:${(Math.min(1, Math.max(0, pct)) * 100).toFixed(1)}%;"></div>
        </div>
        <div class="tt-range-labels">
          <span>${metricDef.format(currentDist.min)}</span>
          <span>${metricDef.format(currentDist.max)}</span>
        </div>
      </div>`;
  }

  const cells = [
    ['Média', ATLAS.fmtMoney(p.salario_medio)],
    ['Desvio', ATLAS.fmtMoney(p.salario_stddev)],
    ['P25', ATLAS.fmtMoney(p.p25)],
    ['P75', ATLAS.fmtMoney(p.p75)],
    ['Coef. var.', cov],
    ['P75−P25', rangeVal],
  ];

  ATLAS.showTooltip(info.x, info.y, `
    <div class="tt-head">
      <span class="tt-name">${nomeMun}</span>
      <span class="tt-badge">${p.sigla_uf || ufFromId(p.id_municipio)}</span>
    </div>
    <div class="tt-sub">${ATLAS.fmtNum(p.n_vinculos, 0)} vínculos formais</div>
    <div class="tt-metric">${metricDef.format(p._metricValue)}</div>
    <div class="tt-metric-label">${metricDef.label} · ${ano} · ${SETOR_LABELS[setor] || setor}</div>
    ${rangeHtml}
    <div class="tt-grid">
      ${cells.map(([k, v]) => `<div class="tt-cell"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
    </div>
    ${buildComparisonHtml(p._metricValue, metrica)}
  `);
}

function buildComparisonHtml(val, metrica) {
  if (val == null || !currentDist || currentDist.avg == null) return '';
  const avg = currentDist.avg;
  const diff = val - avg;
  const pct = avg > 0 ? (diff / avg) : 0;
  const cls = diff >= 0 ? 'above' : 'below';
  const sign = diff >= 0 ? '+' : '';
  return `<div class="tt-compare ${cls}">${sign}${ATLAS.fmtNum(pct * 100, 1)}% ${diff >= 0 ? 'acima' : 'abaixo'} da média dos municípios</div>`;
}

function updateLegend(values, metricDef) {
  if (values.length === 0) {
    ATLAS.buildLegend({ type: 'gradient', title: metricDef.label, gradient: { stops: ['#555', '#555'], minLabel: '—', maxLabel: '—' } });
    return;
  }
  values.sort((a, b) => a - b);
  // hard color steps: the map uses discrete quantile bins, not a smooth ramp
  const stops = paletteStops(metricDef.palette);

  ATLAS.buildLegend({
    type: 'gradient',
    title: metricDef.label,
    unit: 'quantis por município',
    gradient: {
      stops,
      minLabel: metricDef.format(values[0]),
      maxLabel: metricDef.format(values[values.length - 1]),
    },
    footer: metricDef.desc,
  });
}

const SETOR_LABELS = { privado: 'Privado', publico: 'Público', todos: 'Todos' };

function updateStats(values, merged) {
  const ctx = document.getElementById('stat-context');
  if (ctx) ctx.textContent = `${currentState.ano} · ${SETOR_LABELS[currentState.setor] || currentState.setor}`;
  if (values.length === 0 || merged.features.length === 0) {
    document.getElementById('stat-media').textContent = '—';
    document.getElementById('stat-menor').textContent = '—';
    document.getElementById('stat-maior').textContent = '—';
    document.getElementById('stat-vinculos').textContent = '—';
    document.getElementById('stat-municipios').textContent = '—';
    return;
  }

  values.sort((a, b) => a - b);
  const metricDef = METRICS[currentState.metrica];
  const avg = values.reduce((s, v) => s + v, 0) / values.length;
  const min = values[0];
  const max = values[values.length - 1];

  let totalVinculos = 0;
  for (const f of merged.features) {
    totalVinculos += f.properties.n_vinculos || 0;
  }

  document.getElementById('stat-media').textContent = metricDef.format(avg);
  document.getElementById('stat-menor').textContent = metricDef.format(min);
  document.getElementById('stat-maior').textContent = metricDef.format(max);
  document.getElementById('stat-vinculos').textContent = ATLAS.fmtNum(totalVinculos, 0);
  document.getElementById('stat-municipios').textContent = ATLAS.fmtNum(values.length, 0);
}

async function onFilterChange() {
  currentState.setor = document.getElementById('select-setor').value;
  currentState.ano = document.getElementById('select-ano').value;
  await ensureYear(currentState.ano);
  updateMap();
  updateUrlState();
}

function onMetricChange(metric) {
  currentState.metrica = metric;
  document.querySelectorAll('.metric-pill').forEach(el => {
    el.classList.toggle('active', el.dataset.metric === metric);
  });
  updateMap();
  updateUrlState();
}

function updateUrlState() {
  const params = new URLSearchParams(window.location.search);
  Object.entries(currentState).forEach(([k, v]) => params.set(k, v));
  const url = `${window.location.pathname}?${params}`;
  window.history.replaceState({}, '', url);
}

function applyUrlState() {
  const params = new URLSearchParams(window.location.search);
  if (params.has('ano')) {
    const v = params.get('ano');
    if (['2020', '2021', '2022', '2023', '2024'].includes(v)) {
      currentState.ano = v;
      document.getElementById('select-ano').value = v;
    }
  }
  if (params.has('setor')) {
    const v = params.get('setor');
    if (['privado', 'publico', 'todos'].includes(v)) {
      currentState.setor = v;
      document.getElementById('select-setor').value = v;
    }
  }
  if (params.has('metrica')) {
    const v = params.get('metrica');
    if (METRICS[v]) {
      currentState.metrica = v;
      document.querySelectorAll('.metric-pill').forEach(el => {
        el.classList.toggle('active', el.dataset.metric === v);
      });
    }
  }
}

const BRAZIL_BOUNDS = [[-74.1, -33.9], [-34.7, 5.4]];

function fitBrazil(map, animate) {
  const leftPad = window.innerWidth > 980 ? 340 : 24;
  const cam = map.cameraForBounds(BRAZIL_BOUNDS, {
    padding: { top: 24, bottom: 24, left: leftPad, right: 24 },
  });
  if (!cam) return;
  const view = {
    longitude: cam.center.lng, latitude: cam.center.lat,
    zoom: cam.zoom, pitch: 0, bearing: 0,
  };
  map._atlasHome = view;
  if (animate) {
    map.flyTo({ center: cam.center, zoom: cam.zoom, pitch: 0, bearing: 0, duration: 600 });
  } else {
    map.jumpTo({ center: cam.center, zoom: cam.zoom, pitch: 0, bearing: 0 });
  }
}

(async () => {
  const { map, deck } = ATLAS.initMap('deckgl-overlay', { pitch: 0 });
  mapInstance = map;
  deckInstance = deck;
  fitBrazil(map, false);

  ATLAS.setupActions(map, VIZ_NUM, getShareState, getActiveSql);
  ATLAS.setupMobilePanels();

  // Event listeners
  document.getElementById('select-setor').addEventListener('change', onFilterChange);
  document.getElementById('select-ano').addEventListener('change', onFilterChange);
  document.querySelectorAll('.metric-pill').forEach(el => {
    el.addEventListener('click', () => onMetricChange(el.dataset.metric));
  });

  // aplicar estado da URL antes de decidir qual ano baixar
  applyUrlState();

  salaryLookup = {};
  const [geojson, nomes] = await Promise.all([
    ATLAS.loadJSON('dados/municipios.geojson.gz'),
    ATLAS.loadJSON('dados/id_municipio_nome.json.gz'),
    ensureYear(currentState.ano),
  ]);

  geoData = geojson;
  window.municipioNome = nomes; // lookup id_municipio → nome

  ATLAS.hideLoading();
  updateMap();

  // Nav arrows — disabled for standalone viz
  document.getElementById('prev-viz')?.style.setProperty('opacity', '0.3');
  document.getElementById('next-viz')?.style.setProperty('opacity', '0.3');
})();
</script>
