<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Swiss Domains Explorer</title>
        <link
            rel="shortcut icon"
            type="image/x-icon"
            href="https://extrapolo.com/favicon.ico"
        />
        <link rel="preconnect" href="https://esm.sh" crossorigin />
        <style>
            :root {
                --bg0: #080c20;
                --bg1: #111736;
                --text: rgba(255, 255, 255, 0.92);
                --muted: rgba(255, 255, 255, 0.68);
                --hairline: rgba(255, 255, 255, 0.1);
                --glass: rgba(10, 14, 39, 0.55);
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
                --blue: #4a90e2;
                --green: #2ecc71;
                --red: #e74c3c;
                --panel-left: calc(20px + env(safe-area-inset-left, 0px));
                --panel-right: calc(20px + env(safe-area-inset-right, 0px));
                --panel-top: calc(18px + env(safe-area-inset-top, 0px));
                --panel-gap: 12px;
                --panel-radius: 18px;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                background: var(--bg0);
                color: var(--text);
                height: 100vh;
                overflow: hidden;
            }

            #hud {
                position: fixed;
                top: var(--panel-top);
                left: var(--panel-left);
                right: var(--panel-right);
                z-index: 10;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: var(--panel-gap);
                pointer-events: none;
            }

            h1 {
                max-width: min(
                    920px,
                    calc(100vw - var(--panel-left) - var(--panel-right))
                );
                font-size: 16px;
                line-height: 1.15;
                font-weight: 650;
                letter-spacing: 0.2px;
                color: var(--text);
                padding: clamp(10px, 1.1vw, 16px) clamp(14px, 1.6vw, 24px);
                border-radius: var(--panel-radius);
                border: 1px solid var(--hairline);
                background: rgba(12, 18, 46, 0.62);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                pointer-events: none;
            }

            #status,
            #selectionStatus,
            #selectedStatus {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                max-width: min(
                    760px,
                    calc(100vw - var(--panel-left) - var(--panel-right))
                );
                padding: clamp(8px, 1vw, 12px) clamp(14px, 1.5vw, 20px);
                border-radius: var(--panel-radius);
                border: 1px solid var(--hairline);
                background: rgba(14, 26, 52, 0.54);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                font-size: 14px;
                line-height: 1.2;
                color: rgba(227, 242, 233, 0.94);
                pointer-events: none;
            }

            #selectionStatus {
                display: none;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                color: rgba(220, 255, 235, 0.92);
                border-color: rgba(46, 204, 113, 0.22);
            }

            #status.loading {
                color: rgba(200, 225, 255, 0.92);
                border-color: rgba(74, 144, 226, 0.22);
            }

            #status.error {
                color: rgba(255, 220, 220, 0.92);
                border-color: rgba(231, 76, 60, 0.22);
            }

            #status.success {
                color: rgba(220, 255, 235, 0.92);
                border-color: rgba(46, 204, 113, 0.22);
            }

            #cosmograph {
                position: absolute;
                inset: 0;
                background: var(--bg0);
                touch-action: none;
                overscroll-behavior: none;
                contain: layout paint size;
            }

            /* Cosmograph mounts a canvas inside the container; keep it pixel-aligned and fill the viewport. */
            #cosmograph canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            @media (max-width: 640px) {
                :root {
                    --panel-left: calc(12px + env(safe-area-inset-left, 0px));
                    --panel-right: calc(12px + env(safe-area-inset-right, 0px));
                    --panel-top: calc(10px + env(safe-area-inset-top, 0px));
                    --panel-gap: 8px;
                    --panel-radius: 14px;
                }

                h1 {
                    font-size: 16px;
                    line-height: 1.18;
                    padding: 8px 11px;
                }

                #status,
                #selectionStatus,
                #selectedStatus {
                    max-width: calc(
                        100vw - var(--panel-left) - var(--panel-right)
                    );
                    padding: 7px 11px;
                    font-size: 14px;
                }
            }
        </style>
    </head>
        <body>
            <div id="hud">
                <h1>View All Swiss Domains and Nameservers</h1>
                <div id="status"></div>
                <div id="selectionStatus"></div>
            </div>
            <div id="cosmograph"></div>

        <script type="module">
            import { Cosmograph } from "https://esm.sh/@cosmograph/cosmograph@2.1.0";
            import {
                tableFromIPC,
                tableToIPC,
                tableFromArrays,
            } from "https://esm.sh/apache-arrow@21.1.0";

            const container = document.getElementById("cosmograph");
            const status = document.getElementById("status");
            const selectionStatus = document.getElementById("selectionStatus");

            let cosmograph = null;
            let currentConfig = null;
            let isLoading = false;
            let fitMethodName = null;

            const urlParams = new URLSearchParams(location.search);
            const precomputedModeRaw = (
                urlParams.get("precomputed") || ""
            ).trim().toLowerCase();
            const precomputedMode =
                precomputedModeRaw === "1" ||
                precomputedModeRaw === "true" ||
                precomputedModeRaw === "yes";
            // Force-layout controls (off by default; enable with ?sim=1)
            // Tip: keep max modest when sim=1 to avoid WebGL context loss.
            const simEnabled = (urlParams.get("sim") || "").trim() === "1";
            const simSteps = Number(urlParams.get("steps") || "0"); // 0 = run continuously
            // More dispersion by default when simulation is enabled.
            const simulationRepulsion = Number(
                urlParams.get("repulsion") || "1.9",
            );
            const simulationLinkDistance = Number(
                urlParams.get("linkDistance") || "85",
            );
            const simulationLinkSpring = Number(
                urlParams.get("linkSpring") || "0.12",
            );
            const simulationFriction = Number(
                urlParams.get("friction") || "0.62",
            );
            const spaceSize = Number(urlParams.get("spaceSize") || "16384");

            // Default behavior: render the full dataset unless the user sets ?max=...
            // Backward-compatible: still accepts legacy ?maxPoints=...
            const maxParamRaw =
                urlParams.get("max") ?? urlParams.get("maxPoints");
            const maxParam = (maxParamRaw || "")
                .trim()
                .toLowerCase();
            const defaultMaxPoints = 0;
            const maxPoints = (() => {
                if (maxParamRaw == null || maxParam === "")
                    return defaultMaxPoints;
                if (maxParam === "all" || maxParam === "0")
                    return 0;
                const n = Number(maxParam);
                return Number.isFinite(n) && n >= 0 ? n : defaultMaxPoints;
            })();

            // Auto-settle (short simulation burst) to increase dispersion without running forever.
            // Off by default because simulation uses a finite square space (can look like a "box").
            // Enable with ?autolayout=1. You can tune with ?autosteps=200&autocap=500000.
            const autoLayoutEnabled =
                (urlParams.get("autolayout") || "").trim() === "1";
            const autoLayoutStepsBase = Math.max(
                0,
                Number(urlParams.get("autosteps") || "200"),
            );
            const autoLayoutCap = Math.max(
                0,
                Number(urlParams.get("autocap") || "500000"),
            );

            function autoLayoutStepsForCap(cap) {
                // Keep the burst short for very large caps; force steps are O(n + m) per tick
                // and can easily trigger GPU/CPU pressure. For <=200k keep full steps.
                if (!Number.isFinite(cap) || cap <= 0)
                    return autoLayoutStepsBase;
                if (cap <= 200000) return autoLayoutStepsBase;
                const scaled = Math.round(autoLayoutStepsBase * (200000 / cap));
                return Math.max(25, Math.min(autoLayoutStepsBase, scaled));
            }

            let baseStatusText = "";
            let labelByRow = null; // Array<string|null>, index = compact row index
            let labelByNodeIdx = null; // Map<number, string|null>, key = node idx
            let pointDataByNodeIdx = null; // Map<number, {idx,index,id,label}>
            let nodeIdxByLabel = null; // Map<string, number>, first node idx by label text
            let lastClickedName = "";
            let hoveredPointData = null;
            let pointClickHandled = false;
            let labelsEnabled = (urlParams.get("labels") || "").trim() !== "0";
            let finalFitTimeout = null;

            async function fetchBytes(url) {
                const res = await fetch(url);
                if (!res.ok)
                    throw new Error(`Failed to fetch ${url} (${res.status})`);
                const buf = await res.arrayBuffer();
                return new Uint8Array(buf);
            }

            function getLabelsConfig(enabled, showLabelsFor = []) {
                if (!enabled) {
                    return {
                        showLabels: false,
                        showLabelsFor: [],
                        showHoveredPointLabel: false,
                        showHoveredNodeLabel: false,
                        showFocusedPointLabel: false,
                        showTopLabels: false,
                        showDynamicLabels: false,
                        showUnselectedPointLabels: false,
                        showSelectedLabels: false,
                    };
                }

                // Label rendering strategy: show a limited amount of top + dynamic labels,
                // and always allow hover + focused label.
                return {
                    pointLabelBy: "label",
                    pointLabelWeightBy: "labelWeight",
                    showLabels: true,
                    // Keep labels deterministic and skip empty-label nodes entirely.
                    showLabelsFor,
                    showTopLabels: false,
                    showDynamicLabels: false,
                    showUnselectedPointLabels: false,
                    showSelectedLabels: false,
                    showHoveredPointLabel: false,
                    showHoveredNodeLabel: false,
                    showFocusedPointLabel: false,
                };
            }

            function setStatus(text, klass) {
                status.textContent = text;
                status.className = klass || "";
            }

            function setSelectionStatus(text) {
                if (!text) {
                    selectionStatus.textContent = "";
                    selectionStatus.style.display = "none";
                    return;
                }
                selectionStatus.textContent = text;
                selectionStatus.style.display = "inline-flex";
            }

            function getNameForSelectionIndex(index) {
                if (!Number.isInteger(index)) return "";
                if (labelByNodeIdx && labelByNodeIdx.has(index))
                    return labelByNodeIdx.get(index);
                if (labelByRow && index >= 0 && index < labelByRow.length)
                    return labelByRow[index];
                return "";
            }

            function getPointDataByIndex(index) {
                if (!Number.isInteger(index)) return null;
                if (pointDataByNodeIdx && pointDataByNodeIdx.has(index))
                    return pointDataByNodeIdx.get(index);
                return {
                    idx: index,
                    index,
                    id: index,
                    label: getNameForSelectionIndex(index) || "",
                };
            }

            function getPointDataByLabel(label) {
                if (typeof label !== "string") return null;
                const trimmed = label.trim();
                if (!trimmed) return null;
                if (!nodeIdxByLabel || !nodeIdxByLabel.has(trimmed)) return null;
                return getPointDataByIndex(nodeIdxByLabel.get(trimmed));
            }

            function toIntegerMaybe(value) {
                if (Number.isInteger(value)) return value;
                if (typeof value !== "string") return null;
                const trimmed = value.trim();
                if (!trimmed) return null;
                const n = Number(trimmed);
                return Number.isInteger(n) ? n : null;
            }

            function normalizePointData(point) {
                if (!point || typeof point !== "object") return null;
                const candidates = [point];
                if (point.data && typeof point.data === "object")
                    candidates.push(point.data);
                if (point.point && typeof point.point === "object")
                    candidates.push(point.point);
                if (point.node && typeof point.node === "object")
                    candidates.push(point.node);
                if (point.detail && typeof point.detail === "object") {
                    if (point.detail.point && typeof point.detail.point === "object")
                        candidates.push(point.detail.point);
                    if (point.detail.node && typeof point.detail.node === "object")
                        candidates.push(point.detail.node);
                }

                for (const candidate of candidates) {
                    if (!candidate || typeof candidate !== "object") continue;
                    const hasIndex =
                        toIntegerMaybe(candidate.idx) != null ||
                        toIntegerMaybe(candidate.index) != null ||
                        toIntegerMaybe(candidate.id) != null;
                    const hasLabel = typeof candidate.label === "string";
                    if (hasIndex || hasLabel) return candidate;
                }

                return candidates[0] || null;
            }

            function resolvePointFromEventArgs(args) {
                for (const arg of args || []) {
                    if (arg == null) continue;

                    const asIndex = toIntegerMaybe(arg);
                    if (asIndex != null) {
                        const byIndex = getPointDataByIndex(asIndex);
                        if (byIndex) return byIndex;
                    }

                    if (typeof arg === "string") {
                        const byLabel = getPointDataByLabel(arg);
                        if (byLabel) return byLabel;
                    }

                    if (Array.isArray(arg)) {
                        const nested = resolvePointFromEventArgs(arg);
                        if (nested) return nested;
                        continue;
                    }

                    if (typeof arg !== "object") continue;
                    const p = normalizePointData(arg);
                    if (!p) continue;
                    const idx = getPointIndexFromData(p);
                    if (idx != null) {
                        const byIndex = getPointDataByIndex(idx);
                        if (byIndex) return byIndex;
                        return p;
                    }
                    if (typeof p.label === "string") {
                        const byLabel = getPointDataByLabel(p.label);
                        if (byLabel) return byLabel;
                    }
                }
                return null;
            }

            function getPointIndexFromData(pointData) {
                if (!pointData || typeof pointData !== "object") return null;
                const idx =
                    toIntegerMaybe(pointData.idx) ??
                    toIntegerMaybe(pointData.index) ??
                    toIntegerMaybe(pointData.id);
                if (idx != null) return idx;
                return null;
            }

            function rememberClickedPointName(point) {
                if (Number.isInteger(point)) {
                    lastClickedName = getNameForSelectionIndex(point);
                    return;
                }
                const p = normalizePointData(point);
                if (!p) {
                    lastClickedName = "";
                    return;
                }
                const label =
                    typeof p.label === "string" ? p.label.trim() : "";
                const idx = getPointIndexFromData(p);
                lastClickedName =
                    label || (idx != null ? getNameForSelectionIndex(idx) : "");
            }

            function callFirstMethod(target, methodNames, args = []) {
                for (const name of methodNames) {
                    if (typeof target?.[name] === "function") {
                        try {
                            target[name](...args);
                            return true;
                        } catch {
                            // try next candidate
                        }
                    }
                }
                return false;
            }

            function applyPointClickShortcut(point) {
                const p = normalizePointData(point);
                if (!p || !cosmograph) return false;
                const idx = getPointIndexFromData(p);
                if (!Number.isInteger(idx)) return false;

                const selected = callFirstMethod(
                    cosmograph,
                    [
                        "clickPoint",
                        "selectPoint",
                        "selectPointByIndex",
                        "setSelectedPointIndex",
                        "setSelectedPointIndices",
                        "setSelectedPointIndexes",
                        "setSelectedPoints",
                    ],
                    [idx],
                ) || callFirstMethod(
                    cosmograph,
                    ["setSelectedPointIndices", "setSelectedPointIndexes", "setSelectedPoints"],
                    [[idx]],
                );

                const focused = callFirstMethod(
                    cosmograph,
                    ["focusPoint", "focusPointByIndex", "setFocusedPointIndex", "setFocusedPoint"],
                    [idx],
                );

                return selected || focused;
            }

            function activatePointShortcut(point) {
                rememberClickedPointName(point);
                applyPointClickShortcut(point);
            }

            function activatePointShortcutFromArgs(...args) {
                const point =
                    resolvePointFromEventArgs(args) || hoveredPointData || null;
                if (!point) return;
                activatePointShortcut(point);
            }

            function maybeFitView(options = {}) {
                // Cosmograph API surface differs a bit across versions/builds; feature-detect.
                const cg = cosmograph;
                if (!cg) return;
                if (!fitMethodName) {
                    const candidates = [
                        "fitView",
                        "zoomToFit",
                        "fitToScreen",
                        "fitToViewport",
                    ];
                    fitMethodName =
                        candidates.find((m) => typeof cg[m] === "function") ||
                        null;
                }
                if (!fitMethodName) return;
                try {
                    cg[fitMethodName](options);
                } catch {
                    try {
                        cg[fitMethodName]();
                    } catch {
                        // ignore
                    }
                }
            }

            function scheduleFinalFit(delayMs = 2600) {
                if (finalFitTimeout) clearTimeout(finalFitTimeout);
                finalFitTimeout = window.setTimeout(() => {
                    // Single final fit with safe padding so all nodes remain in frame.
                    maybeFitView({ padding: 0.08 });
                }, delayMs);
            }

            async function waitForStatsReady(deadlineMs = 120_000) {
                const start = Date.now();
                while (Date.now() - start < deadlineMs) {
                    const st = cosmograph?.stats;
                    if (st && (st.pointsCount > 0 || st.linksCount > 0))
                        return st;
                    await new Promise((r) => setTimeout(r, 200));
                }
                return cosmograph?.stats;
            }

            function hasCols(cols, required) {
                const s = new Set(cols);
                return required.every((c) => s.has(c));
            }

            function getArrowColumns(bytes) {
                try {
                    const t = tableFromIPC(bytes);
                    return t?.schema?.fields?.map((f) => f.name) ?? [];
                } catch (e) {
                    return [`<failed to parse arrow: ${e?.message || e}>`];
                }
            }

            async function makeCompactIpc(nodesBytes, edgesBytes, useFixedXY) {
                const nodesTable = tableFromIPC(nodesBytes);
                const edgesTable = tableFromIPC(edgesBytes);

                const nodeCols = nodesTable.schema.fields.map((f) => f.name);
                const edgeCols = edgesTable.schema.fields.map((f) => f.name);

                if (!hasCols(nodeCols, ["idx"])) {
                    throw new Error(
                        `nodes.arrow missing required column "idx" (found: ${nodeCols.join(", ")})`,
                    );
                }
                if (!hasCols(edgeCols, ["sourceidx", "targetidx"])) {
                    throw new Error(
                        `edges.arrow missing required columns "sourceidx"/"targetidx" (found: ${edgeCols.join(", ")})`,
                    );
                }
                if (useFixedXY && !hasCols(nodeCols, ["x", "y"])) {
                    throw new Error(
                        `precomputed mode requires nodes x/y columns (found: ${nodeCols.join(", ")})`,
                    );
                }

                const n = nodesTable.numRows;
                const cap = maxPoints > 0 ? Math.min(maxPoints, n) : n;

                const idxVec = nodesTable.getChild("idx");
                const idxArr = idxVec.toArray();
                const idxSub = idxArr.subarray(0, cap);

                const degrees = new Int32Array(cap);
                // Cosmograph labels assume point ids are strings (they use .startsWith("cluster-") etc).
                // Keep a compact, stable string id to avoid the labels renderer crashing.
                const ids = new Array(cap);
                for (let i = 0; i < cap; i++) ids[i] = String(idxSub[i]);
                const labelVec = nodesTable.getChild("label");
                const labels = new Array(cap);
                const labelWeight = new Int32Array(cap);
                if (labelVec) {
                    for (let i = 0; i < cap; i++) {
                        const raw = labelVec.get(i);
                        const trimmed = raw == null ? "" : String(raw).trim();
                        const hasLabel = trimmed.length > 0;
                        labels[i] = hasLabel ? trimmed : null;
                        labelWeight[i] = hasLabel ? 1 : 0;
                    }
                } else {
                    for (let i = 0; i < cap; i++) {
                        labels[i] = null;
                        labelWeight[i] = 0;
                    }
                }

                let xSub = null;
                let ySub = null;
                if (useFixedXY) {
                    const xVec = nodesTable.getChild("x");
                    const yVec = nodesTable.getChild("y");
                    xSub = xVec.toArray().subarray(0, cap);
                    ySub = yVec.toArray().subarray(0, cap);
                }
                // Filter edges by idx bounds.
                // Avoid per-edge JS array pushes: count first, allocate typed arrays, then fill.
                const sidx = edgesTable.getChild("sourceidx");
                const tidx = edgesTable.getChild("targetidx");
                const srcAll = sidx.toArray();
                const tgtAll = tidx.toArray();

                let keptEdges = edgesTable.numRows;
                if (maxPoints > 0) {
                    keptEdges = 0;
                    for (let i = 0; i < edgesTable.numRows; i++) {
                        const s = srcAll[i];
                        const t = tgtAll[i];
                        if (s < cap && t < cap) keptEdges++;
                    }
                }

                const srcOut = new Int32Array(keptEdges);
                const tgtOut = new Int32Array(keptEdges);
                for (let i = 0, j = 0; i < edgesTable.numRows; i++) {
                    const s = srcAll[i];
                    const t = tgtAll[i];
                    if (maxPoints > 0 && (s >= cap || t >= cap)) continue;
                    srcOut[j] = s;
                    tgtOut[j] = t;
                    degrees[s] += 1;
                    degrees[t] += 1;
                    j++;
                }

                // Color rule:
                // - orange for degree > 100
                // - pink for degree > 2
                // - blue otherwise
                const hub = new Int8Array(cap);
                for (let i = 0; i < cap; i++) {
                    if (degrees[i] > 100) hub[i] = 2;
                    else if (degrees[i] > 2) hub[i] = 1;
                    else hub[i] = 0;
                }

                // Keep only compact columns needed by the renderer.
                const nodesCompact = tableFromArrays({
                    id: ids,
                    idx: idxSub,
                    degree: degrees,
                    labelWeight,
                    hub,
                    label: labels,
                    ...(useFixedXY ? { x: xSub, y: ySub } : {}),
                });

                const edgesCompact = tableFromArrays({
                    sourceidx: srcOut,
                    targetidx: tgtOut,
                });

                const topLabelIds = [];
                for (let i = 0; i < cap; i++) {
                    if (labels[i]) topLabelIds.push(i);
                }
                topLabelIds.sort((a, b) => degrees[b] - degrees[a]);
                const labelIds = topLabelIds.slice(0, 80).map((i) => ids[i]);

                return {
                    nodesIpc: await tableToIPC(nodesCompact, "file"),
                    edgesIpc: await tableToIPC(edgesCompact, "file"),
                    ids,
                    labels,
                    labelIds,
                    idxSub,
                    cap,
                    originalNodes: n,
                    originalEdges: edgesTable.numRows,
                    filteredEdges: edgesCompact.numRows,
                };
            }

            async function loadDefaultGraph() {
                try {
                    isLoading = true;
                    if (finalFitTimeout) {
                        clearTimeout(finalFitTimeout);
                        finalFitTimeout = null;
                    }
                    setStatus(
                        maxPoints > 0
                            ? `Loading ${precomputedMode ? "precomputed" : "dynamic"} (max=${maxPoints.toLocaleString()})...`
                            : `Loading ${precomputedMode ? "precomputed" : "dynamic"} (max=all)...`,
                        "loading",
                    );

                    const [nodesBytes, edgesBytes] = await Promise.all([
                        fetchBytes(
                            precomputedMode ? "./nodes_xy.arrow" : "./nodes.arrow",
                        ),
                        fetchBytes(
                            precomputedMode ? "./edges_xy.arrow" : "./edges.arrow",
                        ),
                    ]);

                    // Reduce memory pressure by dropping string columns and (optionally) capping points.
                    const {
                        nodesIpc,
                        edgesIpc,
                        ids,
                        labels,
                        labelIds,
                        idxSub,
                        cap,
                        originalNodes,
                        originalEdges,
                        filteredEdges,
                    } = await makeCompactIpc(
                        nodesBytes,
                        edgesBytes,
                        precomputedMode,
                    );

                    labelByRow = labels;
                    labelByNodeIdx = new Map();
                    pointDataByNodeIdx = new Map();
                    nodeIdxByLabel = new Map();
                    for (let i = 0; i < cap; i++) {
                        const idx = Number(idxSub[i]);
                        const label = labels[i] || "";
                        const pointData = {
                            idx,
                            index: idx,
                            id: ids[i],
                            label,
                        };
                        labelByNodeIdx.set(idx, label);
                        pointDataByNodeIdx.set(idx, pointData);
                        if (label && !nodeIdxByLabel.has(label))
                            nodeIdxByLabel.set(label, idx);
                    }
                    lastClickedName = "";
                    hoveredPointData = null;
                    setSelectionStatus("");

                    const enableSimulation =
                        simEnabled ||
                        (!precomputedMode &&
                            autoLayoutEnabled &&
                            autoLayoutStepsBase > 0 &&
                            cap <= autoLayoutCap);
                    // Passing a fixed spaceSize makes the layout feel like it's inside a box.
                    // Only set it when we actually run a simulation (or if user explicitly requests it).
                    const shouldSetSpaceSize =
                        enableSimulation || urlParams.has("spaceSize");

                    const config = {
                        disableLogging: true,
                        statusIndicatorMode: false,
                        fitViewOnInit: false,
                        // If sim=1: run simulation as requested.
                        // Else: optionally run a short auto-settle burst after load for small-ish graphs.
                        enableSimulation,
                        simulationRepulsion,
                        simulationLinkDistance,
                        simulationLinkSpring,
                        simulationFriction,
                        ...(shouldSetSpaceSize ? { spaceSize } : {}),
                        ...getLabelsConfig(labelsEnabled, labelIds),
                        // Click a point to select it + its neighbors; click empty canvas to clear.
                        selectPointOnClick: true,
                        resetSelectionOnEmptyCanvasClick: true,
                        focusPointOnClick: true,
                        onPointHover: (...args) => {
                            hoveredPointData = resolvePointFromEventArgs(args);
                        },
                        onPointClick: (...args) => {
                            pointClickHandled = true;
                            const point = resolvePointFromEventArgs(args);
                            if (point) rememberClickedPointName(point);
                        },
                        // Cosmograph API naming differs by version; support common label-click hooks.
                        onPointLabelClick: (...args) => {
                            activatePointShortcutFromArgs(...args);
                        },
                        onLabelClick: (...args) => {
                            activatePointShortcutFromArgs(...args);
                        },
                        onNodeLabelClick: (...args) => {
                            activatePointShortcutFromArgs(...args);
                        },
                        onPointLabelHover: (...args) => {
                            hoveredPointData = resolvePointFromEventArgs(args);
                        },
                        onLabelHover: (...args) => {
                            hoveredPointData = resolvePointFromEventArgs(args);
                        },
                        onNodeLabelHover: (...args) => {
                            hoveredPointData = resolvePointFromEventArgs(args);
                        },
                        onPointsFiltered: (
                            _filteredPoints,
                            selectedPointIndices,
                        ) => {
                            // When selecting a point with connected points, selectedPointIndices contains:
                            // [clickedPoint, ...neighbors]. Relations ~= neighbors count.
                            if (
                                !Array.isArray(selectedPointIndices) ||
                                selectedPointIndices.length === 0
                            ) {
                                lastClickedName = "";
                                setSelectionStatus("");
                                return;
                            }

                            const clicked = selectedPointIndices[0];
                            const relations = Math.max(
                                0,
                                selectedPointIndices.length - 1,
                            );
                            const name =
                                lastClickedName ||
                                getNameForSelectionIndex(clicked);
                            if (!name || !name.trim()) {
                                setSelectionStatus("");
                                return;
                            }

                            setSelectionStatus(
                                `${name}  •  ${relations.toLocaleString()} domains`,
                            );
                        },
                        points: nodesIpc,
                        links: edgesIpc,
                        pointIdBy: "id",
                        pointIndexBy: "idx",
                        // Keep both id + index mappings for links; Cosmograph expects source/target columns,
                        // and uses *IndexBy for fast joins/filters.
                        linkSourceBy: "sourceidx",
                        linkSourceIndexBy: "sourceidx",
                        linkTargetBy: "targetidx",
                        linkTargetIndexBy: "targetidx",
                        ...(precomputedMode
                            ? {
                                  pointXBy: "x",
                                  pointYBy: "y",
                              }
                            : {}),
                        pointSizeBy: "degree",
                        // Size by number of connections, constrained to a tight visual range.
                        pointSizeRange: [1, 6],
                        pointLabelBy: "label",
                        // Blue by default; pink for degree > 2, orange for degree > 100.
                        pointColorBy: "hub",
                        pointColorStrategy: "map",
                        pointColorByMap: {
                            0: "#2d6cdf",
                            1: "#ff4fa3",
                            2: "#ff8c00",
                        },
                        // Force readable links on a lighter canvas.
                        renderLinks: true,
                        linkColor: "#cfe1ffff",
                        linkOpacity: 0.95,
                        linkWidth: 1.8,
                    };
                    currentConfig = config;

                    if (!cosmograph) {
                        cosmograph = new Cosmograph(container, config);
                    } else {
                        await cosmograph.reset(false);
                    }

                    // Ensure config application is awaited (constructor kicks off async work).
                    await cosmograph.setConfig(config);

                    // Wait for upload + graph rebuild.
                    await cosmograph.dataUploaded();
                    const stats = await waitForStatsReady();

                    if (!stats.pointsCount || !stats.linksCount) {
                        const nodeCols = getArrowColumns(nodesBytes);
                        const edgeCols = getArrowColumns(edgesBytes);
                        throw new Error(
                            [
                                `Cosmograph loaded 0 rows (points=${stats.pointsCount}, links=${stats.linksCount}).`,
                                `nodes.arrow columns: ${nodeCols.join(", ")}`,
                                `edges.arrow columns: ${edgeCols.join(", ")}`,
                                `Expected: nodes has idx (optionally label/id/type) and edges has sourceidx,targetidx.`,
                                `Fix: regenerate nodes.arrow/edges.arrow from your CSVs.`,
                            ].join(" "),
                        );
                    }
                    console.log(
                        `Loaded ${stats.pointsCount} nodes, ${stats.linksCount} edges (from ${originalNodes} nodes, ${originalEdges} edges; using ${cap} nodes, ${filteredEdges} edges).`,
                    );

                    // Run force layout if enabled.
                    if (simEnabled) {
                        // If steps>0, run a fixed number of steps then stop.
                        cosmograph.start(simSteps || undefined);
                        // Recenter once near the end of finite simulations.
                        if (simSteps > 0) {
                            const delay = Math.max(
                                1200,
                                Math.min(12000, Math.round(simSteps * 16)),
                            );
                            scheduleFinalFit(delay);
                        }
                    } else if (
                        !precomputedMode &&
                        autoLayoutEnabled &&
                        autoLayoutStepsBase > 0 &&
                        cap <= autoLayoutCap
                    ) {
                        // Short burst to spread points out; Cosmograph stops automatically after N steps.
                        cosmograph.start(autoLayoutStepsForCap(cap));
                        scheduleFinalFit(2200);
                    } else {
                        // No simulation: perform a single fit once data is ready.
                        scheduleFinalFit(120);
                    }

                    setStatus(
                        `${precomputedMode ? "precomputed" : "dynamic"}: showing ${cap.toLocaleString()} out of ${originalNodes.toLocaleString()} domains`,
                        "success",
                    );
                    baseStatusText = status.textContent || "";

                    // Label text can be slightly offset from the node hit area.
                    // If click lands on label but misses the node hit test, promote hovered point as a click shortcut.
                    if (!container.dataset.labelClickShortcutBound) {
                        container.addEventListener("click", () => {
                            if (pointClickHandled) {
                                pointClickHandled = false;
                                return;
                            }
                            if (!hoveredPointData) return;
                            rememberClickedPointName(hoveredPointData);
                            applyPointClickShortcut(hoveredPointData);
                        });
                        container.dataset.labelClickShortcutBound = "1";
                    }
                } catch (error) {
                    console.error("Error loading from server:", error);
                    setStatus(`Error: ${error.message}`, "error");
                } finally {
                    isLoading = false;
                }
            }

            loadDefaultGraph();
            console.log("Cosmograph ready");

            // Best-effort detection of GPU resets / OOM: WebGL context loss.
            document.addEventListener(
                "webglcontextlost",
                (e) => {
                    e.preventDefault?.();
                    setStatus(
                        "Error: WebGL context lost. This usually means GPU memory pressure (too many points/links). Try ?max=200000 or ?max=all on a stronger GPU.",
                        "error",
                    );
                },
                { capture: true },
            );
        </script>
    </body>
</html>
